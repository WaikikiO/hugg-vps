<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>他们的世界｜请你体验30秒</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

<style>
body{margin:0;background:#000;color:#fff;overflow:hidden;font-family:sans-serif}
.swiper{width:100vw;height:100vh}
.slide{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem;overflow:hidden}

.chaos-canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0}
.content{position:relative;z-index:2}

.fade{opacity:0;transform:translateY(30px);transition:1s}
.show{opacity:1;transform:translateY(0)}

.big{font-size:2.8rem;font-weight:800;line-height:1.3}
.mid{font-size:1.4rem}
.small{font-size:1rem;color:#aaa}
.highlight{color:#38bdf8}

.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
</style>
</head>
<body>

<!-- 音频 -->
<audio id="bgm" loop src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b8b2f.mp3"></audio>
<audio id="noise" src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3"></audio>

<div class="swiper">
<div class="swiper-wrapper">

<div class="swiper-slide slide">
<div class="content">
<div class="big fade">请你花 30 秒</div>
<div class="mid fade mt-6">体验他们的世界</div>
<button onclick="startExperience()" class="mt-10 px-6 py-3 bg-blue-500 rounded-full">开始体验</button>
</div>
</div>

<div class="swiper-slide slide">
<div class="content">
<div class="big fade">当你走进人群</div>
<div class="mid fade mt-6">声音开始放大</div>
</div>
</div>

<div class="swiper-slide slide">
<canvas class="chaos-canvas" id="chaos1"></canvas>
<div class="content">
<div class="big fade">嘈杂 · 刺耳 · 混乱</div>
<div class="mid fade mt-6">你开始不适</div>
</div>
</div>

<div class="swiper-slide slide">
<canvas class="chaos-canvas" id="chaos2"></canvas>
<div class="content">
<div class="big fade">你听见了</div>
<div class="mid fade">却无法回应</div>
</div>
</div>

<div class="swiper-slide slide">
<div class="content">
<div class="big fade">你不是不想</div>
<div class="big fade highlight mt-6">而是做不到</div>
</div>
</div>

<div class="swiper-slide slide">
<div class="content">
<div class="mid fade">每 100 人</div>
<div class="big fade highlight">就有 1 人</div>
</div>
</div>

<div class="swiper-slide slide" id="poster">
<div class="content">
<div class="big">他们不需要被改变</div>
<div class="big highlight mt-4">而需要被理解</div>
<div class="small mt-6">#自闭症理解行动</div>
</div>
</div>

<div class="swiper-slide slide">
<div class="content">
<div class="big fade">请转发这30秒</div>
<button onclick="generatePoster()" class="mt-10 px-8 py-4 bg-blue-500 rounded-full pulse">生成分享海报</button>
</div>
</div>

</div>
<div class="swiper-pagination"></div>
</div>

<script>
const swiper=new Swiper('.swiper',{direction:'vertical',pagination:{el:'.swiper-pagination'}})

function animate(s){
const els=s.querySelectorAll('.fade')
els.forEach((el,i)=>setTimeout(()=>el.classList.add('show'),i*300))
}

swiper.on('slideChangeTransitionStart',()=>{
document.querySelectorAll('.fade').forEach(el=>el.classList.remove('show'))
animate(swiper.slides[swiper.activeIndex])
handleAudio()
})
animate(swiper.slides[0])

// 音频控制
function startExperience(){
document.getElementById('bgm').play()
swiper.slideNext()
}

function handleAudio(){
const index=swiper.activeIndex
const noise=document.getElementById('noise')
if(index===2){noise.play()}else{noise.pause();noise.currentTime=0}
}

// 彩色粒子
function chaos(canvas,intensity=1){
const ctx=canvas.getContext('2d')
let w=canvas.width=window.innerWidth
let h=canvas.height=window.innerHeight
let particles=[]

for(let i=0;i<120*intensity;i++){
particles.push({
x:Math.random()*w,
y:Math.random()*h,
vx:(Math.random()-0.5)*4,
vy:(Math.random()-0.5)*4,
size:Math.random()*3+1,
h:Math.random()*360
})}

function draw(){
ctx.fillStyle='rgba(0,0,0,0.2)'
ctx.fillRect(0,0,w,h)

particles.forEach(p=>{
p.x+=p.vx
p.y+=p.vy
let dx=p.x-w/2,dy=p.y-h/2,dist=Math.sqrt(dx*dx+dy*dy)
p.vx+=(-dy/dist)*0.05*intensity
p.vy+=(dx/dist)*0.05*intensity

if(p.x<0||p.x>w||p.y<0||p.y>h){p.x=Math.random()*w;p.y=Math.random()*h}

ctx.fillStyle=`hsla(${p.h},100%,70%,0.7)`
ctx.fillRect(p.x,p.y,p.size,p.size)
})
requestAnimationFrame(draw)
}
draw()
}

chaos(document.getElementById('chaos1'),1.5)
chaos(document.getElementById('chaos2'),0.6)

// 生成海报
function generatePoster(){
html2canvas(document.getElementById('poster')).then(canvas=>{
const link=document.createElement('a')
link.download='autism-awareness.png'
link.href=canvas.toDataURL()
link.click()
})
}
</script>

</body>
</html>
